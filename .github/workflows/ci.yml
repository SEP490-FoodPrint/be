name: Backend CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Never interrupt an active Azure migration when another dev push arrives.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/dev' }}

jobs:
  code_quality:
    name: Code quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      HUSKY: "0"
      NODE_ENV: test
      NPM_CONFIG_ENGINE_STRICT: "true"
      # Prisma config needs a valid URL; these checks never connect to PostgreSQL.
      DATABASE_URL: postgresql://ci_validation@127.0.0.1:1/foodprint_ci?schema=foodprint
      JWT_SECRET: foodprint-ci-test-only-secret-not-for-runtime
      AUTH_ACCESS_TTL_SECONDS: "900"
      PRISMA_HIDE_UPDATE_MESSAGE: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Validate pull request commit messages
        if: github.event_name == 'pull_request'
        env:
          COMMIT_BASE: ${{ github.event.pull_request.base.sha }}
          COMMIT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: npm exec --no -- commitlint --from "$COMMIT_BASE" --to "$COMMIT_HEAD" --verbose

      - name: Validate pushed commit message
        if: github.event_name == 'push'
        run: git log -1 --format=%B | npm exec --no -- commitlint --verbose

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Generate Prisma Client for type-aware checks
        run: npm run prisma:generate

      - name: Check lint, formatting, types and build
        run: npm run validate

      - name: Run infrastructure-free tests
        run: npm run test:unit

  migrations:
    name: PostgreSQL migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: foodprint_test
          POSTGRES_PASSWORD: foodprint_test_only
          POSTGRES_DB: foodprint_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U foodprint_test -d foodprint_migration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      HUSKY: "0"
      NODE_ENV: test
      NPM_CONFIG_ENGINE_STRICT: "true"
      DATABASE_URL: postgresql://foodprint_test:foodprint_test_only@127.0.0.1:5432/foodprint_migration_test?schema=foodprint
      JWT_SECRET: foodprint-ci-test-only-secret-not-for-runtime
      MIGRATION_TEST_DATABASE_URL: postgresql://foodprint_test:foodprint_test_only@127.0.0.1:5432/foodprint_migration_test?schema=foodprint
      REDIS_URL: redis://127.0.0.1:6379/0
      PRISMA_HIDE_UPDATE_MESSAGE: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Generate Prisma Client for authorization integration tests
        run: npm run prisma:generate

      - name: Verify baseline adoption, migrations and SQL constraints
        run: npm run test:migrations

      - name: Verify dynamic authorization and tenant isolation on PostgreSQL
        run: npm run test:authorization

      - name: Verify atomic refresh rotation and session expiry on Redis
        run: npm run test:auth:redis

      - name: Verify supplier contracts and tenant isolation
        run: npm run test:supplier-onboarding

  quality:
    name: Backend quality
    if: always()
    needs: [code_quality, migrations]
    runs-on: ubuntu-latest
    steps:
      - name: Require both code quality and migration checks
        env:
          CODE_RESULT: ${{ needs.code_quality.result }}
          MIGRATION_RESULT: ${{ needs.migrations.result }}
        run: |
          test "$CODE_RESULT" = success
          test "$MIGRATION_RESULT" = success

  deploy_database:
    name: Deploy Azure database
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    uses: ./.github/workflows/cd.yml
    secrets:
      AZURE_DATABASE_URL: ${{ secrets.AZURE_DATABASE_URL }}
